# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Duser.variant=
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g -Duser.language=en -Duser.country=US -Duser.variant=

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Multiplatform / Native
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# AGP 9 + KMP compatibility: keep the legacy application DSL path
android.builtInKotlin=false
android.newDsl=false
